<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Тусим · Календарь</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E0E10; --bg2:#121214; --card:#1A1A1D; --card2:#222226;
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --text:#fff; --muted:#8E8E93; --muted2:#A1A1AA; --red:#FF6B6B; --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:Manrope,system-ui,-apple-system,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 28px)}
.num,.time,.cell,.when,.free b{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{width:18px;height:18px;stroke:currentColor;stroke-width:1.5;fill:none;stroke-linecap:round;stroke-linejoin:round}

header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:2px;white-space:nowrap}
.nav{display:flex;gap:6px}
.icon-btn{width:36px;height:36px;border-radius:12px;border:1px solid var(--line2);display:grid;place-items:center;background:var(--card);transition:background .15s}
.icon-btn:active,.pill:active{background:var(--card2)}
.pill{height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);background:var(--card);font-weight:700;font-size:13px}

.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:14px}
.seg{display:flex;padding:3px;border-radius:999px;background:var(--card);border:1px solid var(--line)}
.seg button{height:30px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:700;color:var(--muted2);transition:background .15s,color .15s}
.seg button.on{background:#fff;color:#000}
.chip{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line2);font-size:12px;font-weight:700;color:var(--muted2);margin-left:auto;transition:.15s}
.chip.on{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.32)}

.friends{display:flex;gap:12px;overflow-x:auto;margin:0 -16px 16px;padding:2px 16px;scrollbar-width:none}
.friends::-webkit-scrollbar{display:none}
.friend{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:46px}
.friend span{font-size:11px;font-weight:600;color:var(--muted2);max-width:58px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{position:relative;flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;color:#0E0E10}
.av.sm{width:22px;height:22px;font-size:10px;box-shadow:0 0 0 2px var(--card)}
.av.md{width:32px;height:32px;font-size:12px}
.av .dot{position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;border:2px solid var(--bg)}
.st-free{background:#4ADE80}.st-online{background:#60A5FA}.st-busy{background:var(--red)}.st-travel{background:#FBBF24}
.av.maybe{opacity:.75;outline:1px dashed rgba(255,255,255,.8);outline-offset:1px}
.av.pending{opacity:.35}

.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 10px}
.wd{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:6px}
.wd div{text-align:center;font-size:10px;font-weight:800;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.grid,.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cell{border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:700;font-size:15px;min-height:46px;transition:background .15s}
.cell:active{background:var(--card2)}
.cell.out{color:#4a4a50}
.cell.wkend:not(.out):not(.sel){color:var(--muted2)}
.cell.today:not(.sel){box-shadow:inset 0 0 0 1px rgba(255,255,255,.5)}
.cell.sel{background:#fff;color:#000}
.dots{display:flex;gap:3px;height:5px}
.dots i{width:5px;height:5px;border-radius:50%;background:#55555b}
.dots i.mine{background:#fff}
.cell.sel .dots i{background:#999}.cell.sel .dots i.mine{background:#000}
.week .cell{padding:9px 0;min-height:64px}
.week .cell small{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.week .cell.sel small{color:#666}

.agenda{margin-top:20px}
.agenda-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.agenda-h h2{font-size:18px;font-weight:800;letter-spacing:-.01em}
.agenda-h span{font-size:12px;color:var(--muted);font-weight:600}
.free{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.free b{font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;border:1px dashed rgba(255,255,255,.22);color:var(--muted2)}
.ev{display:flex;gap:12px;padding:12px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);margin-bottom:8px;width:100%;text-align:left;transition:background .15s}
.ev:active{background:var(--card2)}
.ev.other{opacity:.6}
.ev .time{min-width:44px;font-size:13px;font-weight:800}
.ev .time small{display:block;color:var(--muted);font-weight:600;margin-top:2px}
.ev .bar{width:3px;border-radius:3px;align-self:stretch;flex:none}
.ev .body{flex:1;min-width:0}
.ev .title{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .meta{font-size:12px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stack{display:flex;align-items:center;margin-top:8px}
.stack .av{margin-left:-5px}.stack .av:first-child{margin-left:0}
.stack em{font-style:normal;font-size:11px;color:var(--muted);margin-left:6px;font-weight:700}
.badge{font-size:11px;font-weight:800;padding:4px 9px;border-radius:999px;border:1px solid var(--line2);color:var(--muted2);align-self:flex-start;white-space:nowrap}
.badge.going{background:#fff;color:#000;border-color:#fff}
.badge.maybe{border-style:dashed}
.empty{padding:26px 12px;text-align:center;color:var(--muted);font-size:14px;border:1px dashed var(--line2);border-radius:var(--r)}
.skel{height:66px;border-radius:var(--r);background:linear-gradient(90deg,#1A1A1D 0%,#242428 50%,#1A1A1D 100%);background-size:200% 100%;animation:sk 1.2s linear infinite;margin-bottom:8px}
@keyframes sk{to{background-position:-200% 0}}

.screen{min-height:75vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:10px}
.screen h2{font-size:20px;font-weight:800}
.screen p{color:var(--muted2);line-height:1.55;max-width:300px}
.screen code{background:var(--card2);padding:2px 7px;border-radius:6px;font-size:13px;color:#fff}

.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .2s}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--bg2);border-top:1px solid var(--line2);border-radius:22px 22px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom) + 24px);transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);max-height:86vh;overflow:auto}
body.open .sheet-bg{opacity:1;pointer-events:auto}
body.open .sheet{transform:none}
.grab{width:36px;height:4px;border-radius:4px;background:var(--line2);margin:0 auto 16px}
.sheet .cat{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:800}
.sheet h3{font-size:22px;font-weight:800;letter-spacing:-.015em;margin-top:4px}
.sheet .when{color:var(--muted2);margin-top:6px;font-size:14px;font-weight:600}
.sheet .row{display:flex;gap:8px;align-items:center;color:var(--muted2);margin-top:10px;font-size:14px}
.sheet .sec{margin-top:20px}
.sheet .sec-t{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:800;margin-bottom:6px}
.sheet .desc{color:#d4d4d8;line-height:1.55;white-space:pre-wrap}
.person{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.person:last-child{border:0}
.person .name{flex:1;font-weight:700}
.person .name small{display:block;font-weight:600;color:var(--muted);font-size:12px}

.fab{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom) + 20px);width:56px;height:56px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center;box-shadow:0 8px 28px rgba(0,0,0,.5);transition:transform .15s}
.fab:active{transform:scale(.93)}
.fab svg{width:24px;height:24px;stroke-width:2.2}
.form label{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:800;margin:16px 0 6px}
.form input,.form textarea{width:100%;background:var(--card);border:1px solid var(--line2);border-radius:12px;color:#fff;font:inherit;font-size:16px;padding:12px;outline:none;color-scheme:dark}
.form input:focus,.form textarea:focus{border-color:rgba(255,255,255,.4)}
.form textarea{min-height:72px;resize:vertical}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{height:34px;padding:0 12px;border-radius:999px;border:1px solid var(--line2);font-size:13px;font-weight:700;color:var(--muted2);display:flex;align-items:center;gap:6px;transition:.15s}
.opt.on{background:#fff;color:#000;border-color:#fff}
.opt .av{width:20px;height:20px;font-size:10px}
.form .err{color:var(--red);font-size:13px;font-weight:600;margin-top:12px;min-height:18px}
.form .hint{color:var(--muted);font-size:12px;margin-top:6px}
.submit{width:100%;height:50px;border-radius:14px;background:#fff;color:#000;font-weight:800;font-size:16px;margin-top:10px}
.submit:disabled{opacity:.5}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 92px);transform:translate(-50%,20px);background:#fff;color:#000;font-weight:700;font-size:14px;padding:10px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="app"></div>
<div class="sheet-bg" data-act="close"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div id="sheet-body"></div></div>
<div class="toast" id="toast"></div>

<script>
const API = "https://gqlslscpxehonlyajssy.supabase.co/functions/v1/tusim-bot?api=calendar";
const BOT = "@calasisbot";
const DAY_START = 10, DAY_END = 23, MIN_FREE = 60;

const WD = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"];
const WD_FULL = ["Понедельник", "Вторник", "Среда", "Четверг", "Пятница", "Суббота", "Воскресенье"];
const MONTHS = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];
const MONTHS_GEN = ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"];
const CAT = { meet: "Встреча", game: "Игры", call: "Созвон", trip: "Поездка", other: "Другое" };
const RSVP = { going: "Иду", maybe: "Возможно", pending: "Не ответил", declined: "Не смогу" };
const STATUS = { free: "свободен", busy: "занят", travel: "в поездке", online: "онлайн" };
const ICON = {
  left: '<svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>',
  right: '<svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>',
  pin: '<svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
  clock: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  plus: '<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
};

const tg = window.Telegram && window.Telegram.WebApp;
const $app = document.getElementById("app");
const state = { view: "month", cursor: dayStart(new Date()), sel: dayStart(new Date()), onlyMine: false, data: null, loading: true };
const cache = new Map();

// ---------- даты ----------
function dayStart(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; }
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function key(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
function same(a, b) { return key(a) === key(b); }
function wdIdx(d) { return (d.getDay() + 6) % 7; }
function monday(d) { return addDays(dayStart(d), -wdIdx(d)); }
function at(d, h) { const x = dayStart(d); x.setHours(h); return x; }
function hm(d) { return new Date(d).toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" }); }
function longDay(d) { return `${WD_FULL[wdIdx(d)]}, ${d.getDate()} ${MONTHS_GEN[d.getMonth()]}`; }

function range() {
  if (state.view === "week") { const m = monday(state.cursor); return [m, addDays(m, 7)]; }
  const first = new Date(state.cursor.getFullYear(), state.cursor.getMonth(), 1);
  const start = monday(first);
  return [start, addDays(start, 42)];
}

// ---------- утилиты ----------
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const haptic = () => tg && tg.HapticFeedback && tg.HapticFeedback.selectionChanged();

function avatar(p, cls = "", extra = "") {
  if (!p) return "";
  const letter = esc((p.display_name || p.username || "?").trim()[0].toUpperCase());
  return `<div class="av ${cls}" style="background:${esc(p.color || "#60A5FA")}">${letter}${extra}</div>`;
}

// ---------- данные ----------
async function load(from, to) {
  const k = from.toISOString() + to.toISOString();
  if (cache.has(k)) return cache.get(k);
  const res = await fetch(`${API}&from=${encodeURIComponent(from.toISOString())}&to=${encodeURIComponent(to.toISOString())}`, {
    headers: { "x-init-data": tg.initData },
  });
  if (res.status === 403) throw Object.assign(new Error("not linked"), { code: "not_linked" });
  if (res.status === 401) throw Object.assign(new Error("unauthorized"), { code: "unauthorized" });
  if (!res.ok) throw new Error("HTTP " + res.status);
  const data = await res.json();
  const byId = new Map(data.profiles.map((p) => [p.id, p]));
  for (const e of data.events) {
    e.start = new Date(e.starts_at);
    e.end = new Date(e.ends_at);
    e.my = e.participants.find((x) => x.user_id === data.me.id && x.rsvp !== "declined");
    e.author = byId.get(e.created_by);
  }
  data.byId = byId;
  cache.set(k, data);
  return data;
}

function eventsByDay(data) {
  const map = new Map();
  for (const e of data.events) {
    if (state.onlyMine && !e.my) continue;
    for (let d = dayStart(e.start); d < e.end; d = addDays(d, 1)) {
      const k = key(d);
      if (!map.has(k)) map.set(k, []);
      map.get(k).push(e);
    }
  }
  for (const list of map.values()) list.sort((a, b) => a.start - b.start);
  return map;
}

function freeWindows(data, day) {
  const busy = [];
  for (const e of data.events) if (e.my && e.my.rsvp !== "pending") busy.push([+e.start, +e.end]);
  for (const s of data.slots) {
    if (s.user_id === data.me.id && s.kind !== "free") busy.push([Date.parse(s.starts_at), Date.parse(s.ends_at)]);
  }
  busy.sort((a, b) => a[0] - b[0]);
  const end = +at(day, DAY_END);
  let cur = Math.max(+at(day, DAY_START), Math.ceil(Date.now() / 9e5) * 9e5);
  const out = [];
  for (const [s, f] of busy) {
    if (Math.min(s, end) - cur >= MIN_FREE * 6e4) out.push([cur, Math.min(s, end)]);
    cur = Math.max(cur, f);
  }
  if (end - cur >= MIN_FREE * 6e4) out.push([cur, end]);
  return out;
}

// ---------- отрисовка ----------
function title() {
  if (state.view === "week") {
    const m = monday(state.cursor), s = addDays(m, 6);
    return m.getMonth() === s.getMonth()
      ? `${m.getDate()}–${s.getDate()} ${MONTHS_GEN[s.getMonth()]}`
      : `${m.getDate()} ${MONTHS_GEN[m.getMonth()].slice(0, 3)} – ${s.getDate()} ${MONTHS_GEN[s.getMonth()].slice(0, 3)}`;
  }
  return `${MONTHS[state.cursor.getMonth()]}${state.cursor.getFullYear() !== new Date().getFullYear() ? " " + state.cursor.getFullYear() : ""}`;
}

function dayCell(d, byDay, opts = {}) {
  const list = byDay.get(key(d)) || [];
  const dots = list.slice(0, 3).map((e) => `<i class="${e.my ? "mine" : ""}"></i>`).join("");
  const cls = ["cell",
    opts.out ? "out" : "", wdIdx(d) > 4 ? "wkend" : "",
    same(d, new Date()) ? "today" : "", same(d, state.sel) ? "sel" : ""].join(" ");
  return `<button class="${cls}" data-act="day" data-d="${key(d)}">${opts.label || ""}<span>${d.getDate()}</span><div class="dots">${dots}</div></button>`;
}

function renderCalendar(byDay) {
  if (state.view === "week") {
    const m = monday(state.cursor);
    let cells = "";
    for (let i = 0; i < 7; i++) cells += dayCell(addDays(m, i), byDay, { label: `<small>${WD[i]}</small>` });
    return `<div class="panel"><div class="week">${cells}</div></div>`;
  }
  const [start] = range();
  const month = state.cursor.getMonth();
  let cells = "";
  for (let i = 0; i < 42; i++) {
    const d = addDays(start, i);
    if (i === 35 && d.getMonth() !== month) break; // не рисуем лишнюю шестую неделю
    cells += dayCell(d, byDay, { out: d.getMonth() !== month });
  }
  return `<div class="panel"><div class="wd">${WD.map((w) => `<div>${w}</div>`).join("")}</div><div class="grid">${cells}</div></div>`;
}

function renderEvent(e, data) {
  const ppl = e.participants.filter((p) => p.rsvp !== "declined");
  const stack = ppl.slice(0, 6).map((p) => avatar(data.byId.get(p.user_id), `sm ${p.rsvp}`)).join("");
  const more = ppl.length > 6 ? `<em>+${ppl.length - 6}</em>` : "";
  const meta = [CAT[e.category] || "", e.location ? esc(e.location) : ""].filter(Boolean).join(" · ");
  const badge = e.my ? `<span class="badge ${e.my.rsvp}">${RSVP[e.my.rsvp]}</span>` : "";
  return `<button class="ev ${e.my ? "" : "other"}" data-act="event" data-id="${e.id}">
    <div class="time">${hm(e.start)}<small>${hm(e.end)}</small></div>
    <div class="bar" style="background:${esc(e.author?.color || "#fff")}"></div>
    <div class="body"><div class="title">${esc(e.title)}</div>${meta ? `<div class="meta">${meta}</div>` : ""}
      ${stack ? `<div class="stack">${stack}${more}</div>` : ""}</div>${badge}</button>`;
}

function renderAgenda(byDay, data) {
  const d = state.sel;
  const today = same(d, new Date());
  let html = `<div class="agenda"><div class="agenda-h"><h2>${today ? "Сегодня" : longDay(d)}</h2><span>${today ? longDay(d) : ""}</span></div>`;
  if (state.loading) return html + `<div class="skel"></div><div class="skel"></div></div>`;
  if (dayStart(d) >= dayStart(new Date())) {
    const free = freeWindows(data, d);
    if (free.length) html += `<div class="free">${free.map(([s, f]) => `<b>свободно ${hm(s)}–${hm(f)}</b>`).join("")}</div>`;
  }
  const list = byDay.get(key(d)) || [];
  html += list.length ? list.map((e) => renderEvent(e, data)).join("") : `<div class="empty">Планов нет</div>`;
  return html + "</div>";
}

function renderFriends(data) {
  if (!data) return `<div class="friends" style="height:62px"></div>`;
  const ppl = [data.byId.get(data.me.id), ...data.profiles.filter((p) => p.id !== data.me.id)].filter(Boolean);
  return `<div class="friends">${ppl.map((p) => `<div class="friend" title="${esc(STATUS[p.status] || "")}">
    ${avatar(p, "", `<i class="dot st-${esc(p.status)}"></i>`)}<span>${p.id === data.me.id ? "Вы" : esc(p.display_name)}</span></div>`).join("")}</div>`;
}

function render() {
  const data = state.loading ? null : state.data;
  const byDay = data ? eventsByDay(data) : new Map();
  $app.innerHTML = `
    <header>
      <div><div class="eyebrow">Тусим</div><h1>${title()}</h1></div>
      <div class="nav">
        <button class="icon-btn" data-act="prev" aria-label="Назад">${ICON.left}</button>
        <button class="pill" data-act="today">Сегодня</button>
        <button class="icon-btn" data-act="next" aria-label="Вперёд">${ICON.right}</button>
      </div>
    </header>
    <div class="toolbar">
      <div class="seg">
        <button class="${state.view === "month" ? "on" : ""}" data-act="view" data-v="month">Месяц</button>
        <button class="${state.view === "week" ? "on" : ""}" data-act="view" data-v="week">Неделя</button>
      </div>
      <button class="chip ${state.onlyMine ? "on" : ""}" data-act="mine">Только мои</button>
    </div>
    ${renderFriends(data)}
    ${renderCalendar(byDay)}
    ${renderAgenda(byDay, data)}
    ${data ? `<button class="fab" data-act="new" aria-label="Создать событие">${ICON.plus}</button>` : ""}
    <div style="height:70px"></div>`;
}

function screen(title, text) {
  $app.innerHTML = `<div class="screen"><h2>${title}</h2><p>${text}</p></div>`;
}

// ---------- карточка события ----------
function openEvent(id) {
  const data = state.data;
  const e = data && data.events.find((x) => x.id === id);
  if (!e) return;
  const sameDay = same(e.start, e.end) || +e.end === +addDays(dayStart(e.start), 1);
  const when = sameDay
    ? `${longDay(e.start)} · ${hm(e.start)}–${hm(e.end)}`
    : `${e.start.getDate()} ${MONTHS_GEN[e.start.getMonth()]} ${hm(e.start)} – ${e.end.getDate()} ${MONTHS_GEN[e.end.getMonth()]} ${hm(e.end)}`;
  const order = { going: 0, maybe: 1, pending: 2, declined: 3 };
  const ppl = [...e.participants].sort((a, b) => order[a.rsvp] - order[b.rsvp]);
  document.getElementById("sheet-body").innerHTML = `
    <div class="cat">${CAT[e.category] || ""}</div>
    <h3>${esc(e.title)}</h3>
    <div class="when">${when}</div>
    ${e.location ? `<div class="row">${ICON.pin}${esc(e.location)}</div>` : ""}
    ${e.author ? `<div class="row">${avatar(e.author, "sm")}Создал(а) ${esc(e.author.display_name)}</div>` : ""}
    ${e.description ? `<div class="sec"><div class="sec-t">Описание</div><div class="desc">${esc(e.description)}</div></div>` : ""}
    <div class="sec"><div class="sec-t">Участники · ${ppl.filter((p) => p.rsvp === "going").length} идут</div>
      ${ppl.map((p) => {
        const pr = data.byId.get(p.user_id);
        return pr ? `<div class="person">${avatar(pr, `md ${p.rsvp}`)}<div class="name">${esc(pr.display_name)}<small>@${esc(pr.username)}</small></div>
          <span class="badge ${p.rsvp}">${RSVP[p.rsvp]}</span></div>` : "";
      }).join("")}
    </div>`;
  document.body.classList.add("open");
  tg.BackButton.show();
  haptic();
}

function closeSheet() {
  document.body.classList.remove("open");
  tg.BackButton.hide();
}

// ---------- создание события ----------
const API_CREATE = API.replace("api=calendar", "api=create");
const DURATIONS = [[60, "1 ч"], [120, "2 ч"], [180, "3 ч"], [240, "4 ч"], [480, "Весь вечер"]];
let draft = null;

function newDraft() {
  const d = dayStart(state.sel) < dayStart(new Date()) ? dayStart(new Date()) : state.sel;
  return { title: "", category: "meet", date: key(d), time: "19:00", minutes: 120, location: "", description: "", guests: new Set(), all: false };
}

function renderForm(err = "") {
  const data = state.data;
  const friends = data.profiles.filter((p) => p.id !== data.me.id);
  const opt = (act, val, on, label) => `<button type="button" class="opt ${on ? "on" : ""}" data-act="${act}" data-v="${esc(val)}">${label}</button>`;
  document.getElementById("sheet-body").innerHTML = `<div class="form">
    <h3>Новое событие</h3>
    <label>Что</label>
    <input name="title" maxlength="120" placeholder="Квиз в баре" value="${esc(draft.title)}" autocomplete="off">
    <label>Тип</label>
    <div class="opts">${Object.entries(CAT).map(([k, v]) => opt("cat", k, draft.category === k, v)).join("")}</div>
    <div class="two">
      <div><label>Дата</label><input name="date" type="date" min="${key(new Date())}" value="${draft.date}"></div>
      <div><label>Начало</label><input name="time" type="time" step="300" value="${draft.time}"></div>
    </div>
    <label>Длительность</label>
    <div class="opts">${DURATIONS.map(([m, l]) => opt("dur", m, draft.minutes === m, l)).join("")}</div>
    <label>Где</label>
    <input name="location" maxlength="120" placeholder="Необязательно" value="${esc(draft.location)}" autocomplete="off">
    <label>Описание</label>
    <textarea name="description" maxlength="1000" placeholder="Необязательно">${esc(draft.description)}</textarea>
    <label>Кого позвать</label>
    <div class="opts">${opt("all", "1", draft.all, "Всех")}${friends.map((p) =>
      opt("guest", p.id, draft.all || draft.guests.has(p.id), `${avatar(p)}${esc(p.display_name)}`)).join("")}</div>
    <div class="hint">Приглашённым придёт сообщение от бота, а в подключённых группах появится опрос «Иду / Возможно / Не смогу».</div>
    <div class="err">${esc(err)}</div>
    <button type="button" class="submit" data-act="submit">Создать и отправить опрос</button>
  </div>`;
}

function openForm() {
  draft = newDraft();
  renderForm();
  document.body.classList.add("open");
  tg.BackButton.show();
}

async function submitForm(btn) {
  const start = new Date(`${draft.date}T${draft.time}`);
  if (!draft.title.trim()) return renderForm("Напишите название");
  if (isNaN(+start)) return renderForm("Укажите дату и время");
  if (+start < Date.now() - 5 * 6e4) return renderForm("Это время уже прошло");
  btn.disabled = true;
  btn.textContent = "Создаю…";
  try {
    const res = await fetch(API_CREATE, {
      method: "POST",
      headers: { "x-init-data": tg.initData, "content-type": "application/json" },
      body: JSON.stringify({
        title: draft.title, category: draft.category, starts_at: start.toISOString(), minutes: draft.minutes,
        location: draft.location, description: draft.description, guests: draft.all ? "all" : [...draft.guests],
      }),
    });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.error && body.error !== "server" ? body.error : "Не получилось создать, попробуйте ещё раз");
    tg.HapticFeedback && tg.HapticFeedback.notificationOccurred("success");
    closeSheet();
    cache.clear();
    state.sel = dayStart(start);
    state.cursor = state.view === "week" ? state.sel : new Date(start.getFullYear(), start.getMonth(), 1);
    toast("Событие создано · опрос отправлен");
    refresh();
  } catch (e) {
    tg.HapticFeedback && tg.HapticFeedback.notificationOccurred("error");
    renderForm(e.message);
  }
}

function toast(text) {
  const el = document.getElementById("toast");
  el.textContent = text;
  el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 2600);
}

document.addEventListener("input", (ev) => {
  const name = ev.target.name;
  if (draft && name in draft) draft[name] = ev.target.value;
});

// ---------- навигация ----------
async function refresh() {
  const [from, to] = range();
  const k = from.toISOString() + to.toISOString();
  state.loading = !cache.has(k);
  render();
  try {
    state.data = await load(from, to);
    state.loading = false;
    render();
  } catch (e) {
    if (e.code === "not_linked") screen("Аккаунт не привязан", `Отправьте ${BOT} команду <code>/link ник пароль</code> и откройте календарь снова.`);
    else if (e.code === "unauthorized") screen("Сессия устарела", `Закройте окно и снова отправьте боту <code>/calendar</code>.`);
    else screen("Не получилось загрузить", `Проверьте интернет и попробуйте ещё раз.<br><br><button class="pill" data-act="retry">Повторить</button>`);
  }
}

function shift(dir) {
  if (state.view === "week") {
    state.cursor = addDays(state.cursor, 7 * dir);
    state.sel = addDays(state.sel, 7 * dir);
  } else {
    state.cursor = new Date(state.cursor.getFullYear(), state.cursor.getMonth() + dir, 1);
    const now = new Date();
    state.sel = state.cursor.getMonth() === now.getMonth() && state.cursor.getFullYear() === now.getFullYear() ? dayStart(now) : state.cursor;
  }
  refresh();
}

document.addEventListener("click", (ev) => {
  const el = ev.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;
  if (act !== "close") haptic();
  if (act === "prev") shift(-1);
  else if (act === "next") shift(1);
  else if (act === "today") { state.cursor = state.sel = dayStart(new Date()); refresh(); }
  else if (act === "view") { state.view = el.dataset.v; state.cursor = state.sel; refresh(); }
  else if (act === "mine") { state.onlyMine = !state.onlyMine; render(); }
  else if (act === "event") openEvent(el.dataset.id);
  else if (act === "close") closeSheet();
  else if (act === "retry") refresh();
  else if (act === "new") openForm();
  else if (act === "cat") { draft.category = el.dataset.v; renderForm(); }
  else if (act === "dur") { draft.minutes = Number(el.dataset.v); renderForm(); }
  else if (act === "all") { draft.all = !draft.all; draft.guests.clear(); renderForm(); }
  else if (act === "guest") {
    const id = el.dataset.v;
    if (draft.all) { draft.all = false; state.data.profiles.forEach((p) => p.id !== state.data.me.id && draft.guests.add(p.id)); }
    draft.guests.has(id) ? draft.guests.delete(id) : draft.guests.add(id);
    renderForm();
  }
  else if (act === "submit") submitForm(el);
  else if (act === "day") {
    const [y, m, d] = el.dataset.d.split("-").map(Number);
    state.sel = new Date(y, m - 1, d);
    if (state.view === "month" && state.sel.getMonth() !== state.cursor.getMonth()) {
      state.cursor = new Date(y, m - 1, 1);
      refresh();
    } else render();
  }
});

// свайп влево/вправо по календарю листает месяцы и недели
let touchX = null;
document.addEventListener("touchstart", (e) => { touchX = e.target.closest(".panel") ? e.touches[0].clientX : null; }, { passive: true });
document.addEventListener("touchend", (e) => {
  if (touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  if (Math.abs(dx) > 60) { haptic(); shift(dx < 0 ? 1 : -1); }
  touchX = null;
}, { passive: true });

// ---------- старт ----------
if (!tg || !tg.initData) {
  screen("Откройте в Telegram", `Этот календарь работает внутри бота ${BOT}. Отправьте ему <code>/calendar</code>.`);
} else {
  tg.ready();
  tg.expand();
  try { tg.setHeaderColor("#0E0E10"); tg.setBackgroundColor("#0E0E10"); } catch (_) {}
  tg.BackButton.onClick(closeSheet);
  refresh();
}
</script>
</body>
</html>
