<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="dark">
<title>Тусим · Календарь</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0B0D; --bg2:#111114; --card:#17171A; --card2:#1F1F23; --card3:#28282D;
  --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.12); --line3:rgba(255,255,255,.2);
  --text:#fff; --muted:#8E8E93; --muted2:#B4B4BB; --red:#FF6B6B;
  --free:#4ADE80; --online:#60A5FA; --busy:#FF6B6B; --travel:#FBBF24;
  --r:16px; --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--text);font-family:Manrope,system-ui,-apple-system,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
body{--pad:16px;min-height:100vh;min-height:100dvh;
  padding:calc(max(env(safe-area-inset-top),var(--tg-safe-area-inset-top,0px)) + var(--tg-content-safe-area-inset-top,0px) + 10px) var(--pad) calc(env(safe-area-inset-bottom) + 28px);
  background:radial-gradient(120% 60% at 50% -10%,rgba(255,255,255,.06),transparent 60%),var(--bg) fixed}
.num,.time,.cell,.when,code{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
svg{width:18px;height:18px;stroke:currentColor;stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:none}
.in{animation:in .32s var(--ease) both}
@keyframes in{from{opacity:0;transform:translateY(6px)}}

/* ---------- шапка ---------- */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:4px 0 16px}
.eyebrow{font-size:12px;color:var(--muted);font-weight:600}
.eyebrow b{color:var(--muted2);font-weight:700}
h1{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin-top:3px;white-space:nowrap}
h1 span{color:var(--muted);font-weight:700}
.nav{display:flex;gap:6px;align-items:center}
.icon-btn{width:38px;height:38px;border-radius:13px;border:1px solid var(--line2);display:grid;place-items:center;background:var(--card);transition:background .15s,transform .1s}
.icon-btn:active,.pill:active{background:var(--card2);transform:scale(.96)}
.pill{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);background:var(--card);font-weight:700;font-size:13px;transition:background .15s,transform .1s}

/* ---------- ближайшее событие ---------- */
.next{position:relative;display:block;width:100%;padding:16px;border-radius:20px;margin-bottom:16px;overflow:hidden;
  background:linear-gradient(135deg,var(--c,#60A5FA) -40%,transparent 55%),var(--card);border:1px solid var(--line2)}
.next::after{content:"";position:absolute;inset:0;background:radial-gradient(80% 120% at 100% 0,rgba(255,255,255,.07),transparent 60%);pointer-events:none}
.next .k{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.75)}
.next .k i{width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 0 0 rgba(255,255,255,.6);animation:pulse 1.8s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 7px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
.next .t{font-size:20px;font-weight:800;letter-spacing:-.02em;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.next .m{display:flex;gap:14px;margin-top:6px;color:var(--muted2);font-size:13px;font-weight:600}
.next .m span{display:flex;align-items:center;gap:5px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.next .m svg{width:15px;height:15px;opacity:.8}
.next .cd{position:absolute;right:16px;top:14px;font-size:12px;font-weight:800;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.12);backdrop-filter:blur(8px)}

/* ---------- панель управления ---------- */
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:16px}
.seg{display:flex;padding:3px;border-radius:999px;background:var(--card);border:1px solid var(--line)}
.seg button{height:32px;padding:0 16px;border-radius:999px;font-size:13px;font-weight:700;color:var(--muted2);transition:background .2s var(--ease),color .2s}
.seg button.on{background:#fff;color:#000}
.chip{height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--line2);font-size:12px;font-weight:700;color:var(--muted2);margin-left:auto;display:flex;align-items:center;gap:6px;transition:.15s}
.chip.on{background:#fff;color:#000;border-color:#fff}

/* ---------- секции ---------- */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:0 2px 10px}
.sec-h h2{font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sec-h em{font-style:normal;font-size:12px;font-weight:700;color:var(--muted2)}
.sec-h em b{color:var(--free)}

/* ---------- друзья ---------- */
.friends{display:flex;gap:14px;overflow-x:auto;margin:0 calc(-1 * var(--pad)) 18px;padding:4px var(--pad) 2px;scrollbar-width:none}
.friends::-webkit-scrollbar{display:none}
.friend{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:52px}
.friend .nm{font-size:11px;font-weight:700;color:var(--text);max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.friend .st{font-size:10px;font-weight:600;color:var(--muted);margin-top:-4px}
.friend.me{text-align:center;transition:transform .15s}
.friend.me:active{transform:scale(.94)}
.friend.me .st{text-decoration:underline dotted;text-underline-offset:3px}
.st-dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.av{position:relative;flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:15px;color:#0B0B0D}
.av.ring{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ring,transparent)}
.av.sm{width:24px;height:24px;font-size:10px;box-shadow:0 0 0 2px var(--card)}
.av.md{width:36px;height:36px;font-size:13px}
.av.maybe{opacity:.8;outline:1.5px dashed rgba(255,255,255,.85);outline-offset:1px}
.av.pending{opacity:.35}
.av.declined{opacity:.2;filter:grayscale(1)}

/* ---------- календарь ---------- */
.panel{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:22px;padding:12px 10px 10px}
.wd{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:4px}
.wd div{text-align:center;font-size:10px;font-weight:800;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;padding:4px 0}
.wd div:nth-child(n+6){color:#6b6b72}
.grid,.week{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cell{position:relative;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-weight:700;font-size:15px;min-height:48px;transition:background .15s,transform .1s}
.cell:active{transform:scale(.94)}
.cell.out{color:#3d3d43}
.cell.wkend:not(.out):not(.sel){color:var(--muted2)}
.cell.past:not(.sel):not(.today){color:#5c5c63}
.cell.today:not(.sel){background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px var(--line3)}
.cell.sel{background:#fff;color:#000;box-shadow:0 6px 18px rgba(255,255,255,.12)}
.dots{display:flex;gap:3px;height:5px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--c,#777);opacity:.45}
.dots i.mine{opacity:1}
.cell.sel .dots i{opacity:.9}
.week .cell{padding:10px 0;min-height:70px}
.week .cell small{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.week .cell.sel small{color:#555}
.week .cell span{font-size:18px}
.evs{display:none}

/* ---------- план дня ---------- */
.agenda{margin-top:22px}
.agenda-h{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:0 2px 12px}
.agenda-h h2{font-size:20px;font-weight:800;letter-spacing:-.02em}
.agenda-h span{font-size:12px;color:var(--muted);font-weight:700;padding-bottom:3px}
.free{display:flex;gap:6px;overflow-x:auto;margin:0 calc(-1 * var(--pad)) 14px;padding:0 var(--pad);scrollbar-width:none}
.free::-webkit-scrollbar{display:none}
.free b{flex:none;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:7px 11px;border-radius:999px;background:rgba(74,222,128,.08);border:1px solid rgba(74,222,128,.25);color:#b6f3cb}
.free b svg{width:14px;height:14px}

.tl-item{display:flex;gap:12px;width:100%;margin-bottom:10px}
.tl-time{width:44px;flex:none;padding-top:14px;font-size:13px;font-weight:800;text-align:right}
.tl-time small{display:block;color:var(--muted);font-weight:600;font-size:12px;margin-top:2px}
.tl-rail{position:relative;width:10px;flex:none;display:flex;justify-content:center;padding-top:18px}
.tl-rail i{width:10px;height:10px;border-radius:50%;background:var(--c,#fff);box-shadow:0 0 0 3px var(--bg),0 0 12px var(--c,#fff);z-index:1}
.tl-item:not(:last-child) .tl-rail::after{content:"";position:absolute;top:30px;bottom:-14px;width:1.5px;background:var(--line2)}
.tl-card{flex:1;min-width:0;padding:13px 14px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);transition:background .15s,transform .1s;position:relative;overflow:hidden}
.tl-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c,#fff);opacity:.9}
.tl-item:active .tl-card{background:var(--card2);transform:scale(.985)}
.tl-item.other .tl-card{opacity:.6}
.tl-item.now .tl-card{border-color:var(--line3);background:linear-gradient(90deg,rgba(255,255,255,.05),transparent),var(--card)}
.cat{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.cat svg{width:13px;height:13px}
.tl-card .title{font-weight:800;font-size:16px;letter-spacing:-.01em;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-card .meta{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted2);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-card .meta svg{width:13px;height:13px;opacity:.7}
.tl-card .foot{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:8px}
.stack{display:flex;align-items:center}
.stack .av{margin-left:-6px}.stack .av:first-child{margin-left:0}
.stack em{font-style:normal;font-size:11px;color:var(--muted);margin-left:8px;font-weight:700}
.badge{font-size:11px;font-weight:800;padding:4px 10px;border-radius:999px;border:1px solid var(--line2);color:var(--muted2);white-space:nowrap}
.badge.going{background:#fff;color:#000;border-color:#fff}
.badge.maybe{border-style:dashed;color:#fff}
.badge.declined{color:var(--muted)}
.badge.now{background:var(--red);border-color:var(--red);color:#fff}

.empty{display:flex;flex-direction:column;align-items:center;gap:10px;padding:30px 16px;text-align:center;color:var(--muted);font-size:14px;border:1px dashed var(--line2);border-radius:20px}
.empty svg{width:34px;height:34px;stroke-width:1.2;color:#55555c}
.empty b{color:var(--text);font-size:15px}
.empty .pill{margin-top:4px;background:#fff;color:#000;border-color:#fff}
.skel{height:84px;border-radius:var(--r);background:linear-gradient(90deg,var(--card) 0%,var(--card2) 50%,var(--card) 100%);background-size:200% 100%;animation:sk 1.2s linear infinite;margin:0 0 10px 66px}
@keyframes sk{to{background-position:-200% 0}}

/* ---------- экраны-заглушки ---------- */
.screen{min-height:78vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:12px}
.screen .ic{width:64px;height:64px;border-radius:22px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line2);margin-bottom:6px}
.screen .ic svg{width:28px;height:28px}
.screen h2{font-size:22px;font-weight:800;letter-spacing:-.02em}
.screen p{color:var(--muted2);line-height:1.55;max-width:290px}
.screen code{background:var(--card2);padding:2px 7px;border-radius:7px;font-size:13px;color:#fff}

/* ---------- нижний лист ---------- */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .25s}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--bg2);border-top:1px solid var(--line2);border-radius:26px 26px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom) + 24px);transform:translateY(105%);transition:transform .32s var(--ease);max-height:88vh;overflow:auto}
body.open .sheet-bg{opacity:1;pointer-events:auto}
body.open .sheet{transform:none}
body.open{overflow:hidden}
.grab{width:38px;height:4px;border-radius:4px;background:var(--line3);margin:0 auto 18px}
.hero{margin:-4px -4px 0;padding:16px;border-radius:20px;background:linear-gradient(135deg,var(--c,#60A5FA) -60%,transparent 60%),var(--card);border:1px solid var(--line2)}
.hero h3{font-size:24px;font-weight:800;letter-spacing:-.025em;margin-top:8px;line-height:1.15}
.hero .row{display:flex;gap:8px;align-items:center;color:var(--muted2);margin-top:8px;font-size:14px;font-weight:600}
.hero .row svg{width:16px;height:16px;opacity:.75}
.sheet .sec{margin-top:22px}
.sheet .sec-t{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800;margin-bottom:10px}
.sheet .desc{color:#d9d9de;line-height:1.6;white-space:pre-wrap;font-size:15px}
.bar{display:flex;height:6px;border-radius:6px;overflow:hidden;background:var(--card2);margin-bottom:12px}
.bar i{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;font-weight:700;color:var(--muted2);margin-bottom:6px}
.legend span{display:flex;align-items:center;gap:5px}
.legend span::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.person{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.person:last-child{border:0}
.person .name{flex:1;font-weight:700;min-width:0}
.person .name small{display:block;font-weight:600;color:var(--muted);font-size:12px;margin-top:1px}
.author{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:13px;color:var(--muted2);font-weight:600}
.danger{width:100%;height:50px;border-radius:16px;margin-top:24px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:15px;color:var(--red);background:rgba(255,107,107,.08);border:1px solid rgba(255,107,107,.25);transition:background .15s,transform .1s,color .15s}
.danger:active{transform:scale(.98)}
.danger.confirm{background:var(--red);color:#fff;border-color:var(--red)}
.danger:disabled{opacity:.5}
.ghost{width:100%;height:50px;border-radius:16px;margin-top:24px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:15px;background:var(--card);border:1px solid var(--line2);transition:background .15s,transform .1s}
.ghost:active{transform:scale(.98)}
.ghost + .danger{margin-top:8px}
@media (hover:hover){.ghost:hover{background:var(--card2);border-color:var(--line3)}}

/* ---------- форма ---------- */
.fab{position:fixed;right:18px;bottom:calc(env(safe-area-inset-bottom) + 20px);height:56px;padding:0 20px 0 16px;border-radius:999px;background:#fff;color:#000;display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;box-shadow:0 10px 30px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.3);transition:transform .15s}
.fab:active{transform:scale(.94)}
.fab svg{width:22px;height:22px;stroke-width:2.2}
.form h3{font-size:24px;font-weight:800;letter-spacing:-.025em}
.form .lead{color:var(--muted);font-size:13px;margin-top:4px}
.form label{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:800;margin:18px 0 8px}
.form input,.form textarea{width:100%;background:var(--card);border:1px solid var(--line2);border-radius:14px;color:#fff;font:inherit;font-size:16px;padding:13px 14px;outline:none;color-scheme:dark;transition:border-color .15s,background .15s}
.form input:focus,.form textarea:focus{border-color:rgba(255,255,255,.45);background:var(--card2)}
.form input.big{font-size:20px;font-weight:800;padding:15px 14px}
.form textarea{min-height:76px;resize:vertical}
.form .two{display:grid;grid-template-columns:1.3fr 1fr;gap:8px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{height:38px;padding:0 13px;border-radius:999px;border:1px solid var(--line2);font-size:13px;font-weight:700;color:var(--muted2);display:flex;align-items:center;gap:7px;transition:.15s;background:var(--card)}
.opt:active{transform:scale(.96)}
.opt.on{background:#fff;color:#000;border-color:#fff}
.opt svg{width:15px;height:15px}
.opt .av{width:22px;height:22px;font-size:10px;margin-left:-6px}
.form .err{color:var(--red);font-size:13px;font-weight:700;margin-top:14px;min-height:18px}
.form .hint{display:flex;gap:8px;color:var(--muted);font-size:12px;line-height:1.5;margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--card)}
.form .hint svg{width:15px;height:15px;margin-top:1px}
.toggle{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:18px;padding:13px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line2);transition:background .15s}
.toggle b{display:block;font-size:14px;font-weight:800}
.toggle small{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-top:2px;line-height:1.4}
.toggle i{flex:none;position:relative;width:44px;height:26px;border-radius:999px;background:var(--card3);transition:background .2s}
.toggle i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#8E8E93;transition:transform .2s var(--ease),background .2s}
.toggle.on i{background:#fff}
.toggle.on i::after{transform:translateX(18px);background:#000}
@media (hover:hover){.toggle:hover{background:var(--card2)}}
.submit{width:100%;height:54px;border-radius:16px;background:#fff;color:#000;font-weight:800;font-size:16px;margin-top:6px;transition:transform .1s,opacity .15s}
.submit:active{transform:scale(.98)}
.submit:disabled{opacity:.5}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 92px);transform:translate(-50%,20px);display:flex;align-items:center;gap:8px;background:#fff;color:#000;font-weight:800;font-size:14px;padding:11px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:.3s var(--ease);white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.sheet-x{display:none}
.desk{display:none}

/* ---------- мышь ---------- */
@media (hover:hover){
  .icon-btn:hover,.pill:hover,.chip:not(.on):hover,.opt:not(.on):hover{background:var(--card2);border-color:var(--line3)}
  .seg button:not(.on):hover{color:#fff}
  .cell:not(.sel):hover{background:rgba(255,255,255,.05)}
  .tl-item:hover .tl-card{background:var(--card2);border-color:var(--line2)}
  .next:hover{border-color:var(--line3)}
  .friend.me:hover .av{transform:scale(1.06)}
  .submit:hover,.fab:hover{opacity:.92}
  .danger:not(.confirm):hover{background:rgba(255,107,107,.14)}
  .friends,.free{scrollbar-width:thin}
}
.av{transition:transform .15s}
:focus-visible{outline:2px solid rgba(255,255,255,.6);outline-offset:2px}
.form input:focus-visible,.form textarea:focus-visible{outline:none}

/* ---------- широкое окно: лист по центру ---------- */
@media (min-width:600px){
  body{--pad:24px}
  #app{max-width:640px;margin:0 auto}
  .sheet{left:50%;right:auto;bottom:auto;top:50%;width:min(480px,calc(100vw - 48px));max-height:min(86vh,820px);
    border:1px solid var(--line2);border-radius:24px;padding:22px 22px 24px;box-shadow:0 30px 80px rgba(0,0,0,.6);
    opacity:0;pointer-events:none;transform:translate(-50%,-47%) scale(.98);transition:transform .25s var(--ease),opacity .2s}
  body.open .sheet{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
  .grab{display:none}
  .sheet-x{display:grid;place-items:center;position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:11px;
    background:var(--card2);border:1px solid var(--line2);z-index:2;transition:background .15s}
  .sheet-x:hover{background:var(--card3)}
  .sheet .hero,.form h3{padding-right:52px}
  .toast{bottom:32px}
  .friends,.free{flex-wrap:wrap;overflow:visible;margin-left:0;margin-right:0;padding-left:0;padding-right:0}
}

/* ---------- ноутбук: две колонки ---------- */
@media (min-width:900px){
  body{--pad:32px;padding-top:28px}
  #app{max-width:1200px}
  h1{font-size:34px}
  .top{margin:0 0 22px}
  .desk{display:inline-flex}
  .pill.add{background:#fff;color:#000;border-color:#fff;margin-left:6px}

  .layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(320px,1fr);gap:28px;align-items:start}
  .col-side{position:sticky;top:24px;max-height:calc(100vh - 48px);overflow-y:auto;scrollbar-width:thin;padding-right:4px}
  .agenda{margin-top:0}
  .panel{padding:14px 12px 12px}
  .grid,.week{gap:4px}
  .cell{align-items:stretch;justify-content:flex-start;gap:4px;min-height:104px;padding:8px;border-radius:12px;font-size:14px;
    background:rgba(255,255,255,.015)}
  .cell > span,.cell > small{align-self:flex-start;padding:0 2px}
  .cell .dots{display:none}
  .cell.sel{box-shadow:0 8px 24px rgba(255,255,255,.1)}
  .week .cell{min-height:220px;padding:10px 8px}
  .week .cell span{font-size:20px;margin-top:-2px}
  .evs{display:flex;flex-direction:column;gap:3px;width:100%;min-width:0}
  .evs em{display:block;font-style:normal;font-size:11px;font-weight:700;line-height:1.3;padding:3px 6px;border-radius:6px;text-align:left;
    color:var(--text);background:rgba(255,255,255,.06);background:color-mix(in srgb,var(--c) 20%,transparent);
    border-left:2px solid var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .evs em:not(.mine){opacity:.55}
  .evs em.more{background:none;border:0;color:var(--muted);padding-left:2px}
  .cell.sel .evs em{color:#000}
  .cell.out .evs{opacity:.5}
}
